<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>발표</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* johnnie-style-ppt 엔진. 대본(data.js)이 원본이고, 장면(scenes/NN.js)은 대본 구절에 매달려 넘어간다.
   레이아웃: 1920×1080 무대 하나를 화면 크기에 맞춰 줄인다(남는 곳은 바탕색).
   기본 모양(johnnie 스타일): 어두운 바탕 · 강조색 하나 · 강조 상자는 빨강 3px · 모서리 10.
   위 = 파트별 진행 바(대본 길이 비례), 아래 왼쪽 = 챕터, 아래 오른쪽 = 발표 제목(고정).
   강조 장면은 가운데 정렬, 자료 · 설명 장면은 왼쪽 정렬. 실제 서비스(지라 · 시트 · 슬랙 · 컨플루언스 · 피그마)는 밝은 창으로 다시 그린다.
   디자인 단계에서 바꾸는 곳은 아래 '서체'와 ':root' 두 곳이다. 장면 마크업과 그 파트 CSS 는 scenes/NN.js. */

/* ── 서체: 두 자리(Ed = 주 서체, Pre = 보조 서체). local() 에 PostScript 이름과 전체 이름을 둘 다 적는다.
      같은 서체도 기기마다 설치 이름이 다를 수 있다. tools/build_single.py 가 이 local() 이름으로 서체 파일을 찾아 넣는다 ── */
@font-face{font-family:"Ed";font-weight:300;src:local("Pretendard-Light"),local("Pretendard Light")}
@font-face{font-family:"Ed";font-weight:400;src:local("Pretendard-Regular"),local("Pretendard Regular")}
@font-face{font-family:"Ed";font-weight:500;src:local("Pretendard-Medium"),local("Pretendard Medium")}
@font-face{font-family:"Ed";font-weight:600;src:local("Pretendard-SemiBold"),local("Pretendard SemiBold")}
@font-face{font-family:"Ed";font-weight:700;src:local("Pretendard-Bold"),local("Pretendard Bold")}
@font-face{font-family:"Ed";font-weight:800;src:local("Pretendard-ExtraBold"),local("Pretendard ExtraBold")}
@font-face{font-family:"Pre";font-weight:400;src:local("Pretendard-Regular"),local("Pretendard Regular")}
@font-face{font-family:"Pre";font-weight:500;src:local("Pretendard-Medium"),local("Pretendard Medium")}
@font-face{font-family:"Pre";font-weight:600;src:local("Pretendard-SemiBold"),local("Pretendard SemiBold")}
@font-face{font-family:"Pre";font-weight:700;src:local("Pretendard-Bold"),local("Pretendard Bold")}
@font-face{font-family:"Pre";font-weight:800;src:local("Pretendard-ExtraBold"),local("Pretendard ExtraBold")}

:root{
  /* ── 테마: 디자인 단계에서 바꾸는 곳. 강조색은 data.js meta.accent 로도 덮어쓴다 ── */
  --paper:#000000; --sheet:rgba(255,255,255,.08); --ink:#FFFFFF; --ink-1:rgba(255,255,255,.89); --ink-2:rgba(255,255,255,.68);
  --ink-3:rgba(255,255,255,.45); --rule:rgba(255,255,255,.25); --rule-2:rgba(255,255,255,.14);
  --accent:#FF4800; --box:#FF0000;
  --mark:var(--accent); --agent:var(--accent); --accent-soft:color-mix(in srgb,var(--accent) 12%,transparent);
  /* 실제 서비스 화면(밝은 창) 안쪽 */
  --ui-bg:#FFFFFF; --ui-bg-2:#F4F5F7; --ui-ink:#172B4D; --ui-ink-2:#5E6C84; --ui-line:#DFE1E6; --ui-link:#0C66E4;
  --f-ed:"Ed",Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --f-pre:"Pre",Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --f-ui:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pre",sans-serif;   /* 서비스 창: 맥은 시스템 서체, 그 밖의 기기는 공유본에 넣은 보조 서체 */
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
[hidden]{display:none!important}  /* 파일을 직접 열 때도 시작 화면 · 도움말이 숨게 */
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);overflow:hidden;box-sizing:border-box;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  font-family:var(--f-ed);-webkit-font-smoothing:antialiased}
#viewport{position:relative;width:100%;height:100%;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%) scale(.5);
  transform-origin:center;background:var(--paper);color:var(--ink);overflow:hidden;font-family:var(--f-ed);font-variant-numeric:tabular-nums;
  word-break:keep-all;overflow-wrap:break-word}
#stage *{box-sizing:border-box}

/* ── 무대 장치 ─────────────────────────────── */
.part{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease,visibility 0s linear .5s}
.part.active{opacity:1;visibility:visible;transition:opacity .5s ease}
.abs{position:absolute}
[data-at],[data-until]{opacity:0;transform:translateY(14px);transition:opacity .45s ease,transform .6s cubic-bezier(.2,.7,.2,1)}
[data-at].on,[data-until].on{opacity:1;transform:none;transition-delay:var(--d,0s)}
[data-at].off,[data-until].off{opacity:0;transform:translateY(-8px);transition-delay:0s}
.fx-fade[data-at]{transform:none}
.fx-pop[data-at]{transform:scale(.9)}
.fx-pop[data-at].on{transform:none}
.fx-wipe[data-at]{opacity:1;transform:none;clip-path:inset(0 100% 0 0);transition:clip-path .9s cubic-bezier(.5,0,.2,1)}
.fx-wipe[data-at].on{clip-path:inset(0 0 0 0)}
.fx-wipe[data-at].off{opacity:0;clip-path:inset(0 0 0 0)}
path.fx-draw[data-at]{transform:none;stroke-dasharray:1 1;stroke-dashoffset:1;transition:opacity .3s,stroke-dashoffset .9s ease}
path.fx-draw[data-at].on{stroke-dashoffset:0}
@media (prefers-reduced-motion:reduce){
  [data-at],[data-until],.fx-pop[data-at]{transform:none!important;transition:opacity .2s!important}
  .fx-wipe[data-at]{clip-path:none}
}

/* ── 글자 (제목 600 40px · 카드 본문 400 50px · 라벨 800 30px · 진행 바 · 푸터 500 20px). 화면 글자는 22px 이상 ── */
.title{position:absolute;left:100px;top:190px;margin:0;font:600 40px/1.3 var(--f-ed);color:var(--ink);letter-spacing:-.01em;white-space:nowrap}
.title.c{left:0;right:0;top:257px;text-align:center}
.disp{margin:0;font:800 120px/1.06 var(--f-ed);letter-spacing:-.03em;color:var(--ink);text-wrap:balance}
.disp-xl{margin:0;font:800 400px/.9 var(--f-ed);letter-spacing:-.05em;color:var(--ink)}
.lead{margin:0;font:600 64px/1.25 var(--f-ed);letter-spacing:-.02em;color:var(--ink);text-wrap:balance}
.body-l{margin:0;font:400 50px/1.4 var(--f-ed);color:var(--ink)}
.body{margin:0;font:400 36px/1.45 var(--f-ed);color:var(--ink-1)}
.label{margin:0;font:800 30px/1.2 var(--f-ed);color:var(--ink)}
.cap{margin:0;font:500 24px/1.4 var(--f-ed);color:var(--ink-2)}
.num{font-family:var(--f-ed);font-weight:800;letter-spacing:-.04em;line-height:.9}
.mono{font-family:var(--f-mono);font-weight:500}
.acc{color:var(--accent)} .dim{color:var(--ink-2)} .faint{color:var(--ink-3)}
.strike{text-decoration:line-through;text-decoration-color:var(--accent);text-decoration-thickness:5px}
.center{text-align:center}

/* ── 물건 ─────────────────────────────── */
/* 카드: 규칙 · 원칙 한 덩어리 */
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:40px 50px;display:flex;flex-direction:column;gap:20px}
/* 강조 상자: 빨강 3px · 모서리 10. .hl 은 요소 바깥에, .hlbox 는 자리를 직접 잡을 때 */
.hl{outline:3px solid var(--box);outline-offset:6px;border-radius:10px}
.hlbox{position:absolute;border:3px solid var(--box);border-radius:10px;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:10px;padding:10px 20px;border-radius:999px;font:500 24px/1.15 var(--f-ed);
  background:var(--sheet);border:1px solid var(--rule);color:var(--ink-1);white-space:nowrap}
.chip.acc{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.logo{display:inline-block;object-fit:contain;vertical-align:middle;flex:none}
.logo.s{width:32px;height:32px} .logo.m{width:56px;height:56px} .logo.l{width:112px;height:112px} .logo.xl{width:180px;height:180px}
.bubble{position:relative;padding:26px 32px;border-radius:20px;background:#FFFFFF;color:#111111;font:600 36px/1.4 var(--f-ed)}
.bubble::after{content:"";position:absolute;left:44px;bottom:-12px;width:26px;height:26px;background:#FFFFFF;transform:rotate(45deg)}
.who{font:500 22px/1 var(--f-ed);color:var(--ink-2);margin-bottom:14px}
.wires{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none;overflow:visible}
.wires path{fill:none;stroke-width:3;stroke-linecap:round}
.w-ink,.w-ag{stroke:var(--ink-2)} .w-acc,.w-mk{stroke:var(--accent)} .w-dash{stroke-dasharray:10 10}
.ah-ink,.ah-ag{fill:var(--ink-2)} .ah-acc,.ah-mk{fill:var(--accent)}

/* 셀 격자: 많은 수를 한눈에(data-cells="99" data-hl-first="28" 또는 data-hl-spread="30") */
.cells{display:grid;grid-template-columns:repeat(var(--cols),var(--cs));gap:var(--cg)}
.cells i{display:block;width:var(--cs);height:var(--cs);border-radius:3px;background:var(--rule-2);opacity:0;transform:scale(.4);
  transition:opacity .3s ease,transform .4s ease,background-color .5s ease;transition-delay:calc(var(--k)*var(--step,3ms))}
.on>.cells i,.cells.on i{opacity:1;transform:none}
.cells i.h{background:var(--ink-2)}
[data-s="hl"] .cells i.h,.cells[data-s="hl"] i.h,[data-s="pulse"] .cells i.h{background:var(--accent)}

/* ── 실제 서비스 화면: 밝은 창으로 다시 그린다(진짜 서비스일 필요는 없다) ── */
.app{background:var(--ui-bg);color:var(--ui-ink);border-radius:12px;overflow:hidden;font-family:var(--f-ui)}
.app>.bar{display:flex;align-items:center;gap:14px;height:56px;padding:0 20px;background:var(--ui-bg-2);border-bottom:1px solid var(--ui-line);
  font:600 20px/1 var(--f-ui);color:var(--ui-ink-2);white-space:nowrap}
.app>.bar .dots{display:flex;gap:8px;margin-right:4px} .app>.bar .dots i{width:12px;height:12px;border-radius:50%;background:#D0D3D9}
.app>.bar .url{flex:1;height:34px;border-radius:8px;background:#FFFFFF;border:1px solid var(--ui-line);display:flex;align-items:center;padding:0 14px;
  font:400 17px/1 var(--f-ui);color:var(--ui-ink-2);overflow:hidden}
.app>.body{padding:28px 32px;color:var(--ui-ink)}   /* 글자 클래스 .body(흰 글자)와 이름이 같아 창 안 글자색을 여기서 되돌린다 */
.app.fg>.body{color:#FFFFFF} .app.term>.body{color:#E6E6E6}
.app img.shot{display:block;width:100%;height:auto}
/* 지라 */
.jira .key{display:flex;align-items:center;gap:10px;font:600 20px/1 var(--f-ui);color:var(--ui-link)}
.jira h4{margin:12px 0 20px;font:600 34px/1.3 var(--f-ui);color:var(--ui-ink)}
.jira dl{display:grid;grid-template-columns:150px 1fr;gap:14px 20px;margin:0;font:400 20px/1.4 var(--f-ui)}
.jira dt{color:var(--ui-ink-2)} .jira dd{margin:0;color:var(--ui-ink)}
.lz{display:inline-block;padding:4px 10px;border-radius:4px;font:700 18px/1.25 var(--f-ui);white-space:nowrap}
.lz.todo{background:#DFE1E6;color:#44546F} .lz.doing{background:#CCE0FF;color:#0055CC} .lz.done{background:#BAF3DB;color:#216E4E} .lz.bug{background:#FFD5D2;color:#AE2E24}
/* 구글 시트 */
.gs table{border-collapse:collapse;font:400 18px/1.3 var(--f-ui);color:#202124}
.gs th{background:#F8F9FA;color:#5F6368;font-weight:400;border:1px solid #E2E3E3;height:30px;padding:0 8px}
.gs td{border:1px solid #E2E3E3;padding:8px 12px;height:42px;white-space:nowrap}
.gs tr.hd td{font-weight:700;background:#F1F3F4}
.st{display:inline-block;padding:3px 12px;border-radius:12px;font:500 18px/1.3 var(--f-ui);white-space:nowrap}
.st.y{background:#FFE5A0;color:#473821} .st.r{background:#FFCFC9;color:#B10202} .st.g{background:#D4EDBC;color:#11734B} .st.b{background:#C6DBE1;color:#0A53A8} .st.n{background:#E6E6E6;color:#3D3D3D}
/* 컨플루언스 */
.cf .crumb{font:400 17px/1 var(--f-ui);color:var(--ui-ink-2)}
.cf h3{margin:12px 0 22px;font:600 40px/1.25 var(--f-ui);color:var(--ui-ink)}
.cf table{border-collapse:collapse;width:100%;font:400 19px/1.4 var(--f-ui);color:var(--ui-ink)}  /* 표는 글자색을 직접 준다(doctype 없이 열면 호환 모드라 물려받지 않는다) */
.cf th{background:#F4F5F7;text-align:left;font-weight:600} .cf td,.cf th{border:1px solid #DFE1E6;padding:10px 14px}
/* 슬랙 */
.sl .chn{font:900 22px/1 var(--f-ui);color:#1D1C1D;padding-bottom:16px;border-bottom:1px solid #DDDDDD;margin-bottom:8px}
.sl .msg{display:grid;grid-template-columns:52px 1fr;gap:14px;padding:12px 0}
.sl .av{width:52px;height:52px;border-radius:10px;background:#4A154B;display:grid;place-items:center;font:700 22px/1 var(--f-ui);color:#FFFFFF;overflow:hidden}
.sl .nm{font:900 21px/1.3 var(--f-ui);color:#1D1C1D} .sl .tm{font:400 16px/1 var(--f-ui);color:#616061;margin-left:8px}
.sl .tag{font:600 13px/1 var(--f-ui);background:#E8E8E8;color:#616061;padding:2px 5px;border-radius:3px;margin-left:6px;vertical-align:2px}
.sl .tx{font:400 21px/1.5 var(--f-ui);color:#1D1C1D}
/* 피그마 캔버스 */
.app.fg{background:#1E1E1E;color:#FFFFFF} .app.fg>.bar{background:#2C2C2C;border-color:#383838;color:#B3B3B3}
.fg .flbl{font:500 15px/1 var(--f-ui);color:#B3B3B3;margin-bottom:8px}
/* 터미널 · Claude Code */
.app.term{background:#0D0D0D;color:#E6E6E6;border:1px solid #2A2A2A} .app.term>.bar{background:#1A1A1A;border-color:#2A2A2A;color:#9A9A9A}
.term .body{font:400 20px/1.6 var(--f-mono)} .term .p{color:#D97757} .term .ok{color:#7CC88A} .term .dim{color:#8A8A8A}
/* 깃허브 */
.gh .row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #D1D9E0;font:400 19px/1.3 var(--f-ui);color:#1F2328}
.gh .row .when{margin-left:auto;color:#59636E;font-size:16px}
/* 휴대폰 */
.phone{position:relative;width:300px;height:620px;border-radius:44px;border:10px solid #1C1C1E;background:#FFFFFF;overflow:hidden;box-shadow:0 0 0 2px #3A3A3C}
.phone img{display:block;width:100%;height:auto}

/* ── 진행 바 · 아래 표시 · 자막(번호 500 20px · 선 3px · 위 50/87 · 아래 1005 · 좌우 100) ── */
#progress{position:absolute;left:100px;right:100px;top:50px;display:flex;gap:10px;z-index:5}
#progress .seg{position:relative;height:40px;flex:var(--g,1) 1 0;min-width:0;cursor:pointer;background:none;border:0;padding:0}
#progress .seg span{position:absolute;left:0;top:0;font:500 20px/1.25 var(--f-ed);color:var(--ink-1);transition:color .3s}
#progress .seg i{position:absolute;left:0;right:0;top:37px;height:3px;border-radius:999px;background:var(--rule);overflow:hidden}
#progress .seg i b{position:absolute;left:0;top:0;bottom:0;width:calc(var(--f,0)*100%);background:var(--ink-1);border-radius:999px}
#progress .seg:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
#foot{position:absolute;left:100px;right:100px;top:1005px;height:25px;display:flex;justify-content:space-between;align-items:center;
  font:500 20px/1.25 var(--f-ed);color:var(--ink-2);z-index:6}
#foot .where{display:flex;gap:14px;align-items:center}
#foot .where b{font:500 20px/1.25 var(--f-ed);color:var(--ink-2)}
#foot .pid{font:500 18px/1 var(--f-mono);color:var(--accent);opacity:0;transition:opacity .3s}
#stage.ui #foot .pid,#stage.subs #foot .pid{opacity:1}
#foot .deck-title{white-space:nowrap}
#foot .ctl{position:absolute;right:0;bottom:44px;display:flex;gap:8px;opacity:0;pointer-events:none;transition:opacity .3s}
#stage.ui #foot .ctl{opacity:1;pointer-events:auto}
#foot button,#start button,#help button{font:500 22px/1 var(--f-ed);color:var(--ink);background:#141414;border:1px solid var(--rule);
  border-radius:999px;padding:12px 20px;cursor:pointer}
#foot button[aria-pressed="true"]{background:#FFFFFF;color:#000000;border-color:#FFFFFF}
#foot button:focus-visible,#start button:focus-visible,#help button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
#sub{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);width:1560px;padding:18px 30px;border-radius:12px;
  background:rgba(20,20,20,.94);border:1px solid var(--rule);font:500 28px/1.5 var(--f-ed);color:var(--ink);z-index:6;text-wrap:pretty}
#sub b{font:600 20px/1 var(--f-mono);color:var(--accent);margin-right:14px;vertical-align:2px}
#sub .ck{font-style:normal;font-weight:700;color:var(--accent);margin:0 6px 0 2px}
#sub .ck.done{color:var(--ink-3)}
/* 리허설 모드: 음성이 클릭 지점을 지날 때 잠깐 뜬다 */
#cue{position:absolute;right:100px;top:950px;height:36px;display:flex;align-items:center;padding:0 18px;border-radius:999px;z-index:7;
  background:var(--accent);color:#000000;font:700 20px/1 var(--f-ed);opacity:0;transform:scale(.85);transition:opacity .12s,transform .12s;pointer-events:none}
#cue.on{opacity:1;transform:none}
#stage[data-mode="live"] :is(#cue,#bPlay,#bAuto){display:none}
/* 음성이 없는 장표: 프레젠테이션(음성) 모드를 숨긴다 */
#stage.noaudio :is(#bMode,#bPlay,#bAuto,#startMode,#startModeNote){display:none}

/* ── 시작 화면 · 도움말 ─────────────────────────────── */
#start,#help{position:absolute;inset:0;z-index:20;background:var(--paper);padding:120px 128px 110px;display:flex;flex-direction:column;justify-content:space-between}
#start .eyebrow{font:600 28px/1 var(--f-ed);letter-spacing:.04em;color:var(--ink-2)}
#start h1{margin:0;font:800 112px/1.06 var(--f-ed);letter-spacing:-.03em}
#start .sub{margin-top:28px;font:500 64px/1.2 var(--f-ed);color:var(--ink-2)}
#start .row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
#start .go{font-size:32px;padding:22px 40px;background:var(--ink);color:var(--paper);border-color:var(--ink)}
#start .parts button{padding:12px 18px}
#start .mode{display:flex;gap:4px;padding:5px;border:1px solid var(--rule);border-radius:999px;background:var(--sheet)}
#start .mode button{border:0;background:none;padding:14px 26px}
#start .mode button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
#start .note{font:500 24px/1.5 var(--f-ed);color:var(--ink-2)}
#start .note.warn{color:var(--mark)}
#start kbd,#help kbd{font:600 22px/1 var(--f-mono);padding:6px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink)}
#help h2{margin:0;font:700 72px/1.1 var(--f-ed)}
#help dl{display:grid;grid-template-columns:260px 1fr;gap:22px 32px;margin:0;font:500 32px/1.3 var(--f-ed)}
#help dt{text-align:right}
#help dd{margin:0;color:var(--ink-2)}

/* 파트별 장면 CSS 는 scenes/0N.js 의 css (그 파트 안에서만 쓰도록 [data-part="0N"] 로 시작) */

/* ── 발표자 화면 (#presenter): 대본 · 다음 · 바로 가기 · 시간 · 발표 화면 미리보기 ─────── */
#pv{position:fixed;inset:0;z-index:30;display:grid;gap:14px 18px;background:var(--paper);color:var(--ink);font-family:var(--f-ed);
  --pvh:clamp(180px,min(48vh,calc(100vh - 476px)),600px);   /* 위: 미리보기 높이 · 아래: 대본. 대본 몫 385px(34px 넉 줄 + 다음 문단 두 줄)을 먼저 남기고 나머지를 미리보기에 */
  grid-template-columns:calc(var(--pvh) * 16 / 9) minmax(0,1fr);grid-template-rows:auto var(--pvh) minmax(0,1fr);
  padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  word-break:keep-all;overflow-wrap:break-word}
#pv button{font:600 15px/1 var(--f-ed);color:var(--ink);background:var(--sheet);border:1px solid var(--rule);border-radius:999px;padding:9px 14px;cursor:pointer;white-space:nowrap}
#pv button:focus-visible{outline:3px solid var(--agent);outline-offset:2px}
#pv button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.pv-top{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.pv-where{display:flex;align-items:baseline;gap:12px;min-width:0;flex:1 1 320px}
.pv-where b{font:700 22px/1.2 var(--f-ed)}
.pv-where span{font:600 15px/1 var(--f-mono);color:var(--agent)}
.pv-meta{display:flex;align-items:baseline;gap:14px;font:600 15px/1 var(--f-ed);color:var(--ink-2)}
.pv-meta .big{font:700 22px/1 var(--f-ed);color:var(--ink);font-variant-numeric:tabular-nums}
.pv-link{color:var(--mark)} .pv-link.ok{color:var(--agent)}
.pv-acts{display:flex;gap:8px;flex-wrap:wrap}
.pv-script{grid-column:1/-1;grid-row:3;min-height:0;overflow:auto;background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:22px 26px;display:flex;flex-direction:column;gap:12px}
.pv-label{font:600 13px/1 var(--f-ed);color:var(--ink-3)}
#pvText{font:500 34px/1.55 var(--f-ed);color:var(--ink)}
#pvText .ck{font-style:normal;font-weight:700;color:var(--agent);margin:0 4px}
#pvText .ck.done{color:var(--ink-3)}
#pvText .ck.next{color:var(--paper);background:var(--agent);border-radius:6px;padding:0 6px}
#pvNext{font:500 20px/1.5 var(--f-ed);color:var(--ink-2);max-width:60em;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.pv-side{grid-column:2;grid-row:2;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:12px}
.pv-preview{grid-column:1;grid-row:2;position:relative;width:100%;height:100%;border:1px solid var(--rule);border-radius:12px;overflow:hidden;background:var(--paper)}
.pv-preview #viewport{position:absolute;inset:0;width:100%;height:100%}
.pv-ctl{display:flex;flex-wrap:wrap;gap:8px}
.pv-note{margin:0;font:500 14px/1.5 var(--f-ed);color:var(--ink-2)}
.pv-nav{display:flex;flex-direction:column;gap:8px}
.pv-parts,.pv-paras{display:flex;flex-wrap:wrap;gap:6px}
.pv-paras button{font:500 13px/1.2 var(--f-ed);border-radius:8px;padding:7px 10px;max-width:230px;overflow:hidden;text-overflow:ellipsis}
.pv-paras button b{font:600 12px/1 var(--f-mono);color:var(--agent);margin-right:6px}
.pv-paras button.on b{color:var(--paper)}
/* 대본 고치기: 켜면 대본 칸에서 바로 고치고 ▶ 를 끌어 옮긴다 */
#pvEditBtn[aria-pressed="true"]{background:var(--agent);color:var(--paper);border-color:var(--agent)}
.pv-editbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.pv-editbar[hidden]{display:none}
.pv-edcount{font:500 14px/1.4 var(--f-ed);color:var(--ink-2)}
.pv-edited{color:var(--agent)}
#pv.pv-editing .pv-script{border-color:var(--agent)}
#pvText[contenteditable]{outline:none;caret-color:var(--agent);cursor:text}
#pv.pv-editing #pvText .ck{cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none}
#pvText .ck.dragging{opacity:.3}
.pv-drop{position:fixed;width:3px;border-radius:2px;background:var(--agent);pointer-events:none;z-index:40}
.pv-ghost{position:fixed;pointer-events:none;z-index:41;font:700 34px/1 var(--f-ed);color:var(--agent);transform:translate(-50%,-120%)}
.pv-paras button.ed b::after{content:" ●";font-size:9px;vertical-align:middle}
@media (max-width:820px){
  #pv{grid-template-columns:minmax(0,1fr);grid-template-rows:none;grid-auto-rows:auto;align-content:start;overflow:auto}
  .pv-preview{grid-column:1;grid-row:2;height:auto;aspect-ratio:16/9} .pv-script{grid-column:1;grid-row:3;min-height:auto;overflow:visible} .pv-side{grid-column:1;grid-row:4;min-height:auto;overflow:visible}
  #pvText{font-size:22px}
}

<!-- 장면: data.js 의 파트마다 한 줄. 파트를 더하면 여기에도 더한다(없으면 시작 화면에 경고가 뜬다) -->
<script src="scenes/01.js"></script>
<script src="scenes/02.js"></script>
<script src="data.js"></script>
<script src="timing.js"></script>
<script>
(function () {
  const D = window.DECK, T = window.TIMING || {};
  const P = D.parts, M = D.meta || {};
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const stage = $('#stage'), viewport = $('#viewport');

  // ── 발표 정보(data.js meta): 제목 · 부제 · 행사 · 아래 고정 제목 · 강조색 ──
  const TITLE = M.title || '발표';
  document.title = TITLE;
  $('#startTitle').textContent = TITLE;
  $('#startSub').textContent = M.subtitle || '';
  $('#startEyebrow').textContent = M.eyebrow || '';
  $('#deckTitle').textContent = M.footer || TITLE;
  if (M.accent) document.documentElement.style.setProperty('--accent', M.accent);
  $('#helpLast').textContent = String(Math.min(9, P.length));
  const VOICE = M.voice || '녹음';                                   // 프레젠테이션 모드 음성 이름(예: 필재)
  const HAS_AUDIO = P.some(p => p.audio);                            // 음성이 하나도 없으면 장표만 보기만 쓴다
  const KEY = String(M.id || TITLE).replace(/\s+/g, '-');            // 같은 출처에서 연 다른 장표와 저장 · 두 창 싱크가 섞이지 않게

  // ── 장면: scenes/NN.js 가 window.SCENES['NN'] = { clicks, css, html } 를 넣는다. data.js 순서대로 section 을 붙인다 ──
  const MISSING = [];
  (function buildScenes() {
    const S = window.SCENES || {}, before = $('#sub');
    let css = '';
    P.forEach(p => {
      const sc = S[p.id];
      if (!sc) { MISSING.push(p.id); console.warn('[장표] 장면 파일 없음:', p.id); }
      const sec = document.createElement('section');
      sec.className = 'part'; sec.dataset.part = p.id; sec.setAttribute('aria-label', `${p.id} ${p.title}`);
      if (sc && sc.clicks) sec.dataset.clicks = sc.clicks;
      sec.innerHTML = (sc && sc.html) || '';
      stage.insertBefore(sec, before);
      if (sc && sc.css) css += `\n/* ${p.id} */\n${sc.css}`;
    });
    if (css) { const st = document.createElement('style'); st.id = 'scene-css'; st.textContent = css; document.head.appendChild(st); }
  })();
  // 브라우저 저장(모드 · 이어 재생 · 대본 고치기). 장표마다 이름을 나눈다. HTML 공유 서비스 같은 샌드박스 iframe 에선 읽기만 해도 예외가 나서 감싼다
  const store = {
    get(k, d) { try { const v = localStorage.getItem(`jsp.${KEY}.${k}`); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(`jsp.${KEY}.${k}`, JSON.stringify(v)); } catch (e) {} }
  };
  // 같은 파일을 두 역할로 연다. 기본은 발표 화면, #presenter 는 발표자 화면. 두 창은 아래 '두 창 싱크'로 맞춘다.
  const ROLE = /^#presenter$/i.test(location.hash || '') ? 'presenter' : 'show';
  let lastActAt = 0, applying = false, startedAt = 0;

  // ── 화면 맞춤 ──
  function fit() {
    const r = viewport.getBoundingClientRect();
    const s = Math.min(r.width / 1920, r.height / 1080);
    stage.style.transform = `translate(-50%,-50%) scale(${s})`;
  }
  addEventListener('resize', fit); fit();

  // ── 타이밍: 측정값이 있으면 쓰고, 없으면 글자 수로 추정한다 ──
  const nz = s => s.replace(/\s/g, '').length;
  // '@$' = 문단 끝(마지막 문장부호 앞). 말을 다 마친 뒤 누르는 전환
  const phraseAt = (text, ph) => (ph === '$' ? text.replace(/[\s.!?…"'”’)]+$/, '').length : text.indexOf(ph));
  function partTimes(part) {
    const out = {};
    if (part.paras.every(p => Array.isArray(T[p.id]))) {
      part.paras.forEach(p => { const [cue, t0, t1] = T[p.id]; out[p.id] = { cue, t0, t1 }; });
      out.dur = T[part.id] || out[part.paras[part.paras.length - 1].id].t1;
      return out;
    }
    const RATE = 6.6, GAP = 1.15; let t = 0.35;
    part.paras.forEach((p, i) => { const d = nz(p.text) / RATE; out[p.id] = { cue: i ? t - GAP / 2 : 0, t0: t, t1: t + d }; t += d + GAP; });
    out.dur = t - GAP + 0.3;
    console.log('[장표] 음성 측정값이 없어 글자 수로 추정:', part.id);   // 음성을 만들기 전에는 늘 이렇다
    return out;
  }
  const TIMES = P.map(partTimes);
  function at(pi, marker) {
    const part = P[pi], tm = TIMES[pi];
    const i0 = marker.indexOf('@');
    const id = (i0 < 0 ? marker : marker.slice(0, i0)).trim();
    const phrase = i0 < 0 ? '' : marker.slice(i0 + 1);
    const pt = tm[id];
    if (!pt) { console.warn('[장표] 대본에 없는 문단:', marker); return Infinity; }
    if (!phrase) return pt.cue;
    const text = part.paras.find(p => p.id === id).text, i = phraseAt(text, phrase);
    if (i < 0) { console.warn('[장표] 대본에 없는 구절:', marker); return pt.cue; }
    return Math.max(pt.cue, pt.t0 + (pt.t1 - pt.t0) * nz(text.slice(0, i)) / nz(text) - 0.15);
  }

  // ── 생성물: 셀 격자(data-cells) ──
  function rnd(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
  $$('[data-cells]').forEach(el => {
    const n = +el.dataset.cells, first = +(el.dataset.hlFirst || 0), spread = +(el.dataset.hlSpread || 0);
    const hl = new Set();
    if (spread) { const r = rnd(29); while (hl.size < spread) hl.add(Math.floor(r() * n)); }
    let h = '';
    for (let k = 0; k < n; k++) h += `<i style="--k:${k}" class="${(k < first || hl.has(k)) ? 'h' : ''}"></i>`;
    el.innerHTML = h;
  });

  // ── 진행 바: 파트 길이 = 대본(음성) 길이 비율 ──
  const prog = $('#progress');
  P.forEach((p, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'seg'; b.style.setProperty('--g', TIMES[i].dur.toFixed(2));
    b.title = `${p.id} ${p.title}`; b.setAttribute('aria-label', `${p.id} ${p.title}`);
    b.innerHTML = `<span>${p.id}</span><i><b></b></i>`;
    b.addEventListener('click', () => { goPart(i, 0); commit(); });
    prog.appendChild(b);
  });
  const segs = $$('.seg', prog);

  // ── 컴파일: 요소마다 등장·퇴장 시각을 미리 계산한다 ──
  const sections = $$('.part');
  const steps = (pi, str) => str.split('|').map(s => { const k = s.lastIndexOf(':'); return { t: at(pi, s.slice(0, k)), v: s.slice(k + 1) }; }).sort((a, b) => a.t - b.t);
  const compiled = sections.map((sec, pi) => {
    const items = [];
    $$('[data-at],[data-until]', sec).forEach(el => items.push({ el, k: 'vis', a: el.dataset.at ? at(pi, el.dataset.at) : 0, u: el.dataset.until ? at(pi, el.dataset.until) : Infinity }));
    $$('[data-state]', sec).forEach(el => items.push({ el, k: 'state', s: steps(pi, el.dataset.state), s0: el.dataset.state0 || '' }));
    $$('[data-state0]:not([data-state])', sec).forEach(el => { el.dataset.s = el.dataset.state0; });
    $$('[data-seq]', sec).forEach(el => items.push({ el, k: 'seq', s: steps(pi, el.dataset.seq).map(x => ({ t: x.t, v: +x.v })), from: el.dataset.from }));
    $$('[data-type]', sec).forEach(el => { const full = el.textContent; el.textContent = ''; items.push({ el, k: 'type', a: at(pi, el.dataset.type), full }); });
    return items;
  });

  // ── 클릭 지점 ──
  // STEP_EVERY = true : 발표 모드는 모든 전환(문단 시작 · data-at · data-until · state · seq · type)에서 멈추고, 누를 때만 다음 전환으로 간다.
  //                     MERGE 초 안에 몰린 전환은 한 번으로 합친다. 누른 뒤에는 페이드 · 타자 · 숫자만 실제 시간으로 끝까지 흐른다.
  // STEP_EVERY = false: 예전 방식. 문단 시작 + data-clicks 구절에서만 멈추고, 그 사이는 LIVE_RATE 로 저절로 재생한다.
  const STEP_EVERY = true, MERGE = 0.3;
  const CLICKS = sections.map(sec => (sec.dataset.clicks || '').split('|').map(s => s.trim()).filter(Boolean));
  const paraAt = (pi, t) => P[pi].paras.reduce((a, p) => (t >= TIMES[pi][p.id].cue - 0.01 ? p.id : a), P[pi].paras[0].id);
  const markOf = (pi, m) => {   // 마커 → { t, id, i: 대본 속 구절 자리(문단 시작이면 -1) }
    const k = m.indexOf('@'), id = (k < 0 ? m : m.slice(0, k)).trim(), para = P[pi].paras.find(p => p.id === id);
    return { t: at(pi, m), id, i: k < 0 || !para ? -1 : phraseAt(para.text, m.slice(k + 1)) };
  };
  const stepMarks = s => s.split('|').map(x => x.slice(0, x.lastIndexOf(':')));
  // 문단 시작 + clicks: 예전 방식의 클릭 지점, 촬영 도구의 --keys(Figma 보드용 핵심 화면)
  const KEYS = sections.map((sec, pi) => {
    const ks = P[pi].paras.map(p => TIMES[pi][p.id].cue);
    CLICKS[pi].map(m => at(pi, m)).forEach(t => { if (ks.every(h => Math.abs(h - t) > 0.8)) ks.push(t); });
    return ks.sort((a, b) => a - b);
  });
  // 멈춤 하나 = { t0: 누를 자리(첫 전환), t1: 누른 뒤 보여 줄 시각(합친 전환까지), id: 문단, i: ▶ 자리, n: 합친 전환 시각 수 }
  const HOLDINFO = sections.map((sec, pi) => {
    const cues = P[pi].paras.map(p => ({ t: TIMES[pi][p.id].cue, id: p.id, i: -1, cue: true }));
    let ev;
    if (STEP_EVERY) {
      const ms = [];

    pvUpdate = t => {
      const ps = P[cur].paras; let k = 0;
      ps.forEach((p, i) => { if (t >= TIMES[cur][p.id].cue - 0.01) k = i; });
      const para = ps[k];
      setText('#pvPart', `${P[cur].id} ${P[cur].title}`);
      setText('#pvPara', para.id);
      if (mode === 'live') {
        const c0 = TIMES[cur][para.id].cue, c1 = k + 1 < ps.length ? TIMES[cur][ps[k + 1].id].cue : Infinity;
        const hs = HOLDS[cur].filter(h => h >= c0 - 0.01 && h < c1 - 0.01);
        setText('#pvClick', `클릭 ${hs.filter(h => h <= t + 0.001).length}/${hs.length}`);
      } else setText('#pvClick', '');
      if (pvKey !== cur + '/' + para.id) {
        pvKey = cur + '/' + para.id;
        renderScript(cur, para);
        const tx = p => (edits[p.id] ? edits[p.id].text : p.text);
        $('#pvNext').textContent = k + 1 < ps.length ? `${ps[k + 1].id} · ${tx(ps[k + 1])}`
          : cur + 1 < P.length ? `${P[cur + 1].id} ${P[cur + 1].title} · ${tx(P[cur + 1].paras[0])}` : '마지막 문단입니다';
        $('.pv-script').scrollTop = 0;
      }
      paint(t);
      if (pvPart !== cur) {   // 이 파트의 문단 바로 가기
        pvPart = cur;
        const box = $('#pvParas'), pi = cur;
        box.innerHTML = '';
        ps.forEach(p => {
          const b = document.createElement('button');
          b.type = 'button'; b.dataset.id = p.id; b.title = p.text;
          b.innerHTML = `<b>${p.id}</b>${esc(p.text.slice(0, 16))}…`;
          b.addEventListener('click', () => goPara(pi, p.id));
          box.appendChild(b);
        });
        edUI();
      }
      $$('#pvParas button').forEach(b => b.classList.toggle('on', b.dataset.id === para.id));
      $$('#pvParts button').forEach(b => b.classList.toggle('on', +b.dataset.i === cur));
      setText('#pvMode', mode === 'live' ? '장표만 보기 · 클릭' : `프레젠테이션 · ${VOICE} 음성`);
      setText('#pvModeBtn', mode === 'live' ? '프레젠테이션으로' : '장표만 보기로');
      setText('#pvPlay', playing ? '멈춤' : '재생');
      $('#pvPlay').hidden = mode === 'live';
      $('#pvModeBtn').hidden = !HAS_AUDIO;
      $('#pvStart').hidden = start.hidden;
      const ok = performance.now() - peers.show < 4500;
      setText('#pvLink', ok ? '● 발표 화면 연결됨' : '○ 발표 화면 연결 안 됨');
      $('#pvLink').classList.toggle('ok', ok);
    };
    const clock = () => {
      const d = new Date(), s = startedAt ? Math.max(0, Math.floor((Date.now() - startedAt) / 1000)) : 0;
      setText('#pvClock', `${two(d.getHours())}:${two(d.getMinutes())}`);
      setText('#pvElapsed', `${Math.floor(s / 60)}:${two(s % 60)}`);
      pvUpdate(now());
    };
    clock(); setInterval(clock, 500);
  }

  // ── 서체 확인: 발표 기기에서 시작 화면의 이 문구부터 본다(서체 이름은 기기마다 다를 수 있다) ──
  async function fonts() {
    const faces = Array.from(document.fonts).filter(f => /^"?(Ed|Pre)"?$/.test(f.family));
    await Promise.allSettled(faces.map(f => f.load()));
    const ok = fam => { const fs = faces.filter(f => f.family.replace(/"/g, '') === fam); return fs.length > 0 && fs.every(f => f.status === 'loaded'); };
    return { ed: ok('Ed'), pre: ok('Pre') };
  }

  // ── 시작 ──
  const hp = /^#p(\w+)$/.exec(location.hash || ''), hpi = hp ? P.findIndex(p => p.id === hp[1]) : -1;   // #p03 = 03 파트부터
  modeUI();
  goPart(Math.max(0, hpi), 0, false);
  setSubs(subsOn); setAuto(autoNext);
  requestAnimationFrame(loop);
  send('hello', {});
  if (MISSING.length) { const n = $('#sceneNote'); n.hidden = false; n.textContent = `장면 파일 없음: ${MISSING.join(' · ')}. scenes/ 에 파일을 만들고 index.html 에 script 줄을 더하세요.`; }
  const FONT_LABEL = M.fonts || '장표 서체';
  fonts().then(r => {
    const note = $('#fontNote');
    if (r.ed && r.pre) note.textContent = `${FONT_LABEL} 확인됨 · 단축키 H`;
    else { note.classList.add('warn'); note.textContent = `이 브라우저에서 ${FONT_LABEL}(${[!r.ed && '주 서체', !r.pre && '보조 서체'].filter(Boolean).join(' · ')})를 찾지 못했습니다. 서체가 설치된 맥의 Chrome 으로 여세요.`; }
  });
})();
</script>
